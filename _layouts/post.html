---
layout: default
---
<header class="page-head">
  <div class="blob b1"></div>
  <div class="wrap" style="max-width:790px">
    <a href="{{ site.baseurl }}/blog/" class="back">← Tous les articles</a><br>
    <span class="eyebrow">{{ page.category | default: "Blog" }} · {{ page.date | date: "%d/%m/%Y" }}</span>
    <h1>{{ page.title }}</h1>
  </div>
</header>
<article class="article">
  {% if page.image and page.image != "" %}<img class="cover" src="{{ page.image | relative_url }}" alt="">{% endif %}
  <div class="body">{{ content }}</div>
</article>
