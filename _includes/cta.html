{%- assign r = site.data.reglages -%}
{%- if r.lien_rdv and r.lien_rdv != "" -%}{%- assign rdv = r.lien_rdv -%}{%- else -%}{%- assign rdv = "/contact/" | relative_url -%}{%- endif -%}
<section class="cta-band">
  <div class="wrap rv" style="text-align:center;max-width:720px">
    <span class="eyebrow">Prête à commencer ?</span>
    <h2 style="font-size:clamp(2rem,3.8vw,3rem);margin:1rem 0 1.4rem">Faisons le <em class="it">premier pas</em> ensemble.</h2>
    <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">
      <a href="{{ rdv }}" class="btn btn-dark">Prendre rendez-vous</a>
      <a href="{{ '/accompagnements/' | relative_url }}" class="btn btn-ghost">Voir les accompagnements</a>
    </div>
  </div>
</section>
